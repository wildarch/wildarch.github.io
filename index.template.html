<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="assets/simple.min.css">
    <link rel="stylesheet" href="index.css">
    <!-- TODO: meta -->
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a class="current" href="/">{{.Name}}</a></li>
                <li><a href="/publications">Publications</a></li>
                <li><a href="/cv">CV</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>{{.Name}}</h1>
            <div class="flex-container">
                <div class="flex-element" id="profile-container">
                    <img id="profile" src="assets/profile.jpg" />
                </div>
                <div class="flex-element" id="about-me-text-container">
                    {{.AboutMe}}

                    <!-- TODO platforms links -->
                </div>
            </div>
        </section>

        <section>
            <h1>News</h1>
            <table id="news-table">
                <tbody>
                    {{range .News}}
                    <tr>
                        <td>{{.Date}}</td>
                        <td>{{.Content}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </section>
    </main>
</body>
